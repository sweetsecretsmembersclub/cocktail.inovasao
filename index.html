<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweet Secrets Members Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Millard:wght@400&display=swap" rel="stylesheet">
  <style>
    html {
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #0a0a0a;
      color: #f8f8f8;
    }
    header {
      padding: 20px 40px;
      background-color: #0a0a0a;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    header img {
      height: 32px;
    }
    header .separator {
      width: 1px;
      height: 24px;
      background: rgba(255,255,255,0.3);
    }
    header span {
      font-family: 'Millard', serif;
      font-size: 1.3rem;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    .divider {
      width: 80%;
      height: 1px;
      margin: 60px auto;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
    }
    .badge {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: transparent;
      border: 0.25px solid #fff;
      margin: 30px auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
    }
    .badge:hover {
      transform: scale(1.05);
      box-shadow: 0 0 8px rgba(255,255,255,0.3);
    }
    .badge img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
    .intro {
      text-align: center;
      max-width: 800px;
      margin: 0 auto 40px;
      padding: 0 20px;
    }
    .intro h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      line-height: 1.3;
      margin-bottom: 20px;
    }
    .intro p {
      font-size: 1.1rem;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.85);
    }
    .cta-button {
      margin-top: 30px;
      padding: 14px 28px;
      background: transparent;
      color: #fff;
      border: 0.25px solid #fff;
      border-radius: 28px;
      font-size: 0.9rem;
      font-weight: 500;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.6s ease-in-out;
    }
    .cta-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 8px rgba(255,255,255,0.3);
    }
    .split-section {
      display: flex;
      flex-wrap: wrap;
      gap: 60px;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      max-width: 1100px;
      margin: auto;
    }
    .split-left, .split-right {
      flex: 1 1 460px;
    }
    .split-left h2 {
      font-size: 2.2rem;
      text-align: left;
    }
    .split-left p {
      font-size: 1.05rem;
      line-height: 1.8;
      text-align: left;
      color: rgba(255, 255, 255, 0.85);
    }
    .curadoria-box {
      background-color: #111;
      padding: 30px;
      border-radius: 12px;
      margin-top: 20px;
      font-size: 1rem;
      line-height: 1.6;
      font-family: 'Inter', sans-serif;
      color: rgba(255,255,255,0.85);
      border-left: 2px solid #ffffff;
    }
    .polaroid {
      background: #f8f8f8;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transform: rotate(-2deg);
      transition: transform 0.3s ease;
      width: 300px;
      margin: auto;
    }
    .polaroid:hover {
      transform: rotate(0deg) scale(1.03);
    }
    .polaroid video {
      width: 100%;
      height: auto;
      border-radius: 6px;
    }
    .benefits-table-wrapper {
      max-width: 800px;
      margin: 60px auto;
      transition: transform 0.3s ease;
    }
    .benefits-table-wrapper:hover .benefits-table {
      transform: scale(1.02);
    }
    .benefits-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 12px;
      box-shadow: none;
      overflow: hidden;
      transition: transform 0.3s ease;
    }
    .benefits-table thead {
      background: rgba(255,255,255,0.05);
    }
    .benefits-table th, .benefits-table td {
      padding: 14px 20px;
      border: 1px solid rgba(255,255,255,0.1);
      text-align: left;
      font-size: 0.95rem;
    }
    .benefits-table th {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
    }
    .benefits-table td {
      color: rgba(255,255,255,0.9);
    }
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      margin: 60px auto 20px;
      text-align: center;
    }
    .experience-toggle {
      text-align: center;
      margin: 30px 0;
    }
    .experience-toggle button {
      background: transparent;
      color: #fff;
      border: 0.25px solid #fff;
      padding: 12px 24px;
      border-radius: 24px;
      cursor: pointer;
      font-size: 0.9rem;
      text-transform: uppercase;
      transition: all 0.5s ease-in-out;
    }
    .experience-toggle button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 8px rgba(255,255,255,0.3);
    }
    .experience-list {
      display: none;
      flex-direction: column;
      gap: 20px;
      max-width: 800px;
      margin: 40px auto;
    }
    .experience-block {
      background: #111;
      padding: 24px;
      border-radius: 12px;
      border-left: 2px solid #fff;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s ease-out;
    }
    .experience-block.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .experience-block h4 {
      margin: 0 0 10px;
      font-size: 1.1rem;
    }
    .experience-block p {
      margin: 0;
      font-size: 0.95rem;
      color: rgba(255,255,255,0.85);
    }
    .exclusive-section {
      text-align: center;
      padding: 40px 20px;
    }
    .exclusive-image-wrapper {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .exclusive-image {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .exclusive-image:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }
    footer {
      text-align: center;
      font-size: 0.9em;
      color: rgba(255,255,255,0.5);
      padding: 40px 20px;
    }
    .social-icon {
      display: inline-block;
      margin: 0 10px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .social-img {
      width: 28px;
      height: 28px;
      filter: brightness(0) invert(1);
    }
    .social-icon:hover {
      transform: scale(1.15);
      box-shadow: 0 0 8px rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <!-- conteúdo da landing permanece o mesmo até o footer -->

  <footer>
    <div style="margin-bottom: 20px;">
      <a href="https://www.linkedin.com" target="_blank" class="social-icon">
        <img src="linkedin-icon.png" alt="LinkedIn" class="social-img">
      </a>
      <a href="https://wa.me/5511999999999" target="_blank" class="social-icon">
        <img src="whatsapp-icon.png" alt="WhatsApp" class="social-img">
      </a>
      <a href="https://www.instagram.com" target="_blank" class="social-icon">
        <img src="instagram-icon.png" alt="Instagram" class="social-img">
      </a>
    </div>
    © Sweet Secrets Members Club · Exclusividade além do óbvio
  </footer>
</body>
</html>
